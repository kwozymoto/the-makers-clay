# Pages CMS — the editing interface at app.pagescms.org
#
# Labels here are what Lydia sees, so they are written as plain questions
# rather than as field names. Order follows how a piece actually gets added:
# photos first, then what it is called, then the price.
#
# Docs: https://pagescms.org/docs

media:
  input: src/assets/pieces
  output: /
  categories: [image]
  extensions: [jpg, jpeg, png, webp]
  # Keep the uploaded filename, tidied up — it is how the site finds the file.
  rename: safe

content:
  - name: pieces
    label: Pieces
    type: collection
    path: src/content/pieces
    format: yaml-frontmatter
    filename: '{fields.title}.md'
    view:
      fields: [title, status, price, kind]
      primary: title
      sort: [order, title, status]
      default:
        sort: order
        order: desc
    fields:
      - name: images
        label: Photos
        type: image
        description: >-
          The first photo is the one shown in the shop. Upright photos look
          best. Upload the full-size photo — the site shrinks it for you.
        options:
          multiple: true

      - name: title
        label: Name (English)
        type: string
        required: true
        description: This also becomes the web address, so keep it short.

      - name: titleZh
        label: 中文名称 · Name (Chinese)
        type: string
        description: Optional. If empty, the English name is used on both.

      - name: price
        label: Price (RM)
        type: number
        description: Leave empty to show "Price on enquiry" instead of a number.

      - name: status
        label: Is it available?
        type: select
        options:
          values:
            - { name: available, label: Available — someone can buy it }
            - { name: sold, label: Sold — keep it listed, marked sold }
            - { name: 'made-to-order', label: Out of stock — can make another }

      - name: kind
        label: Is there only one?
        type: select
        options:
          values:
            - { name: unique, label: One of a kind — when it goes, it is gone }
            - { name: batch, label: I can make this again }

      - name: description
        label: Description (English)
        type: text

      - name: descriptionZh
        label: 中文说明 · Description (Chinese)
        type: text

      - name: dimensions
        label: Size (English)
        type: string
        description: 'For example: Approx. 300 ml · 9 cm tall'

      - name: dimensionsZh
        label: 尺寸 · Size (Chinese)
        type: string

      - name: care
        label: Care (English)
        type: string
        description: 'For example: Dishwasher and microwave safe.'

      - name: careZh
        label: 保养 · Care (Chinese)
        type: string

      - name: featured
        label: Show on the home page
        type: boolean

      - name: order
        label: Position in the shop
        type: number
        description: >-
          Higher numbers appear first. Leave at 0 unless you want to push
          something to the top.

      - name: batch
        label: Batch
        type: string
        description: Optional note to yourself, e.g. 2026-02. Not shown on the site.

  - name: about
    label: About page
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: en
        label: English
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
      - name: zh
        label: 中文
        type: object
        fields:
          - name: heading
            label: 标题 · Heading
            type: string
          - name: paragraphs
            label: 段落 · Paragraphs
            type: text
            list: true

  - name: settings
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: preview
        label: Hide the site from Google
        type: boolean
        description: >-
          Leave this ON while the site is still a work in progress. It shows a
          "work in progress" bar and keeps the site out of search results.
          Turn it OFF when you are ready to be found.

      - name: whatsapp
        label: WhatsApp number
        type: string
        description: >-
          Country code first, digits only, no + or spaces. A Malaysian
          012-345 6789 becomes 60123456789. Until this is set, the enquiry
          buttons send people to Instagram instead.
        pattern: '^[0-9]{8,15}$'

      - name: instagram
        label: Instagram page link
        type: string

      - name: instagramHandle
        label: Instagram name
        type: string
        description: Shown in the footer, e.g. @themakersclay.lydia

      - name: email
        label: Email address
        type: string
        description: Optional. Shown in the footer if filled in.

      - name: waitlistEndpoint
        label: Mailing list form address
        type: string
        description: >-
          Advanced. Paste the form address from MailerLite or Buttondown to
          turn on the "tell me about the next batch" sign-up. Leave empty and
          it shows a Follow on Instagram button instead.

settings:
  content:
    # Merge submitted fields into the existing file rather than rewriting it
    # from the schema above. Without this, saving a piece would drop any field
    # the CMS does not know about — `currency`, for one.
    merge: true
  commit:
    templates:
      create: 'Add {path} (via Pages CMS)'
      update: 'Update {path} (via Pages CMS)'
      delete: 'Delete {path} (via Pages CMS)'
      rename: 'Rename {oldPath} to {newPath} (via Pages CMS)'
